[mod-name]
oppenheimer-artillery-turret=Oppenheimer Lance

[mod-description]
oppenheimer-artillery-turret=A beam weapon powered by your grid and 8 to 32 capacitor banks. A designator picks the target and you authorise every shot. The charge rate sets the size: 36 GW digs a 2,000-tile crater, and past that the crater levels off near 3,000 tiles while the extra power goes into a hotter beam and far more overpressure. Installations aimed at one point share a single sphere. The shock wave takes minutes to arrive, burning the ground and revealing the map as it travels.

[mod-setting-name]
oppenheimer-prepare-chunk-rate=Blast zone preparation rate

[mod-setting-description]
oppenheimer-prepare-chunk-rate=Map chunks generated per tick while an installation prepares a blast zone. Higher values finish a large zone sooner; lower values are easier on a slow machine. Changes apply immediately, including to a preparation already running.

