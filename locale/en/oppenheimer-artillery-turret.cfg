[entity-description]
oppenheimer-artillery-turret=Beam emplacement powered by 8 to 32 capacitor banks. It never fires on its own: designate a target with the lance designator, wait for the barrel to align, then confirm.\n\nCharge (__1__ s): the banks fill at the rate you set. Rate multiplied by __2__ s is the shot; __3__ is a full one.\nBeam: the lance burns while a sphere forms at the target. Installations aimed within 96 tiles of each other share one sphere and end together.\nCollapse: the sphere implodes, then a shock wave burns the ground and reveals the map as it spreads. __4__ tiles takes about 42 seconds.\n\nThe crater is permanent. Damage combines blast overpressure and heat, so armor helps near the edge and not near the center.
oppenheimer-capacitor-pylon=Stores the charge the lance fires with. An installation needs at least 8 to run and 32 for the top of the dial. Draws standby power continuously; charge not committed to a shot is dissipated.
oppenheimer-lance-substation=Power distribution for an Oppenheimer installation. Each one covers a capacitor cluster and connects to its neighbors, so the whole installation runs from one grid connection.
oppenheimer-installation-lamp=Ground lighting for an Oppenheimer installation, and its status indicator. Dark: incomplete. Solid blue: standby. Flashing yellow: barrel turning. Solid amber: aligned and clear to fire. Red: charging, brightest while the lance is lit. Flashing amber: venting.

