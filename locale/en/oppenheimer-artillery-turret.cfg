[item-description]
oppenheimer-artillery-shell=Internal charge gauge, one cell per percent of a full shot. It cannot be crafted or carried.
oppenheimer-capacitor-pylon=An Oppenheimer Lance needs at least 8 of these in its marked slots to operate, and 32 for full yield. Placing the turret marks every slot and places ghosts.
oppenheimer-lance-substation=Four stand at the center of each capacitor cluster. Each powers its own cluster and connects to the next, so an installation needs one grid connection.
oppenheimer-installation-lamp=Ground lighting and status indicator for an Oppenheimer installation. Placed as ghosts with the turret.
oppenheimer-artillery-remote=Designates a target for a lance and starts the barrel turning. Use it again on the same point, or press FIRE on the panel, to confirm: TEST prepares the blast zone, LIVE fires. With Laser Sweep, drag a span instead and fire it from the panel.

