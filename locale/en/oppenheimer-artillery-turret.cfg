fc-prep-tip=Line 1: what the kill radius vaporizes outright. Line 2: everything standing in the whole blast, then how many of your own are inside it.\nOne icon per hostile type: nests, then worms, then units — the ones this surface spawns first, then any that came from elsewhere.\nA snapshot from when the survey finished, not a live count — and sized for the whole battery’s crater, not one installation’s.

fc-sweep=LASER SWEEP
fc-sweep-tip=Drag the designator to mark a span, then press FIRE.\nThe barrel sweeps it, vaporizing what the beam crosses and leaving a wall of fire. No charge cycle, sphere or crater.

# --- one-time notices for saves from older versions ------------------------------
reserve-returned=[color=120,255,140]Oppenheimer: the ammo requirement was removed. __1__ round(s) were returned to their chambers and __2__ spilled beside the installations.[/color]
pivoted=[color=120,190,255]Oppenheimer: the gun now fires a sustained energy lance and detonates where the beam lands. Every installation was returned to STANDBY.[/color]
banks-rebuilt=[color=255,180,60]Oppenheimer:[/color] capacitor banks are now metered grid consumers instead of accumulators. Existing banks were removed. Every installation was re-ghosted and its pad re-laid; place the banks and the four Lance Substations in the marked slots.
banks-tiers-removed=[color=255,180,60]Oppenheimer:[/color] the Buffered Capacitor Bank and Fuel Cell Bank tiers were removed. Any you had built were removed; their slots were re-ghosted for the standard bank on __1__ installation(s).
scaled-36=[color=255,180,60]Oppenheimer:[/color] installations now take 36 capacitor banks in four 3x3 clusters, 9 to operate. Existing banks are unchanged and the 20 new slots are ghosted. __1__ Lance Substation(s) moved to the new corners with their wires kept. __2__ could not move because something stands on the new corner slot; clear it and move them by hand.
scaled-32=[color=255,180,60]Oppenheimer:[/color] installations now take 32 capacitor banks in four 3x3 clusters with the center cell reserved for the mast, 8 to operate. Lance Substations moved from the outer corners to that center cell. __1__ capacitor bank(s) that stood there were removed and spilled beside the installation. __2__ substation(s) moved with their wires kept. __3__ could not move because something stands on the new center slot; clear it and move them by hand.
cells-converted=[color=255,180,60]Oppenheimer:[/color] resonance cells are no longer ammunition. The gun generates them from its capacitor banks as it charges, 100 per standard shot. __1__ obsolete cell(s) were cleared from the chambers and the cell can no longer be crafted.
yield-rescaled=[color=120,190,255]Oppenheimer: 100% is now __1__ GW, a 1.00 Mt shot with an 1800-tile crater. Installations keep the charge rate you set, but that rate now means a different yield. Check the panel before firing.[/color]
rate-reset=[color=255,180,60]Oppenheimer:[/color] the yield selector was replaced by a charge rate; the shot is that rate held for 14 seconds. Every installation was set to __1__ MW. Raise it in the panel to suit your grid.
rescaled-020=[color=120,190,255]Oppenheimer: the dial now runs from 1% to 100%, and 100% is a 2,000-tile crater. The shock wave travels slowly and reveals the map as it goes. __1__ installation(s) set above the new maximum were reduced to 100%, and any detonation in progress was ended.[/color]

# --- console commands -----------------------------------------------------------
muzzle-command-help=Show or set where the lance leaves the barrel. With no arguments it toggles the on-screen marker. "<forward> <lift>" sets both multipliers. "reset" restores the values in config.lua.
profile-command-help=Time each part of the Oppenheimer Lance's per-tick work and report milliseconds per tick to chat and script-output/oppenheimer-profile.txt. Optional arguments: seconds to run, then ticks per averaging window. "off" stops early.
profile-started=Profiling for __1__ s, averaged over __2__-tick windows. Reports go to chat and script-output/__3__.
profile-not-running=No profile is running.
profile-usage=Usage: /oppenheimer-profile [seconds] [window ticks], or /oppenheimer-profile off
muzzle-report=[color=120,200,255]Muzzle:[/color] forward x__1__ (__3__ tiles out), lift x__2__ (__4__ tiles up). Marker __5__. The red circle marks where the beam sprite starts and the blue one where the damage line starts.
muzzle-reset=[color=120,200,255]Muzzle:[/color] restored config values, forward x__1__, lift x__2__.
muzzle-usage=[color=255,140,60]Muzzle:[/color] expected two numbers or "reset". Example: /oppenheimer-muzzle 1.2 0.8

